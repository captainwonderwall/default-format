[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "default-format"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    # Plugin-specific runtime extras (PyPI packages).
    # devflow-sdk is NOT here — devflow provides it at runtime.
]

[tool.setuptools]
py-modules = ["default_format"]

[project.optional-dependencies]
dev = [
    "devflow-sdk @ git+https://github.com/captainwonderwall/devflow-platform@devflow-sdk/v1.0.0#subdirectory=devflow-sdk",
    "pytest>=8",
    "build>=1.0",
]
